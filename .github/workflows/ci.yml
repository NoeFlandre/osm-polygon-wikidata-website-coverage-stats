name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest --cov=src/osm_polygon_wikidata_website_coverage --cov-branch --cov-fail-under=100
      - run: uv run python scripts/check_crap.py
      - run: uv run mkdocs build --strict
      - run: uv build --wheel --out-dir /tmp/wheel
      - run: docker build --tag osm-polygon-wikidata-website-coverage-stats:ci .
      - run: uv run mutmut run --max-children 2
      - name: Require every mutation to be killed
        run: |
          set -euo pipefail
          results="$(uv run mutmut results --all true)"
          printf '%s\n' "$results"
          if grep -Eq ': (survived|timeout|no tests|not checked|suspicious|unviable)$' <<< "$results"; then
            echo "mutmut reported a non-killed mutant" >&2
            exit 1
          fi
          if ! grep -Eq ': killed$' <<< "$results"; then
            echo "mutmut reported no killed mutants" >&2
            exit 1
          fi
