[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "osm-polygon-wikidata-website-coverage"
version = "0.1.0"
description = "Coverage statistics for raw OSM polygons and text-backed datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Noe Flandre" }]
dependencies = [
    "duckdb>=1.1",
    "osmium>=4.3.1",
    "pyarrow>=18",
    "typer>=0.15",
]

[project.scripts]
coverage = "osm_polygon_wikidata_website_coverage.cli:app"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "mutmut>=3.2",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-cov>=6",
    "radon>=6",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_wikidata_website_coverage"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "osm_polygon_wikidata_website_coverage/LICENSE"
"CITATION.cff" = "osm_polygon_wikidata_website_coverage/CITATION.cff"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"
root = ["src", "."]

[tool.coverage.run]
branch = true
source = ["osm_polygon_wikidata_website_coverage"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mutmut]
source_paths = ["src/osm_polygon_wikidata_website_coverage"]
only_mutate = [
    "src/osm_polygon_wikidata_website_coverage/domain/*",
    "src/osm_polygon_wikidata_website_coverage/io/pbf.py",
    "src/osm_polygon_wikidata_website_coverage/sources/*",
]
also_copy = ["CITATION.cff", "LICENSE"]
pytest_add_cli_args_test_selection = [
    "tests",
    "--ignore=tests/architecture",
]
runner = "uv run pytest -q"
